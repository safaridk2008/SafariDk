<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;

            background: linear-gradient(
                -45deg,
                #0f2027,
                #203a43,
                #2c5364,
                #6a11cb
            );

            background-size: 400% 400%;
            animation: backgroundMove 10s ease infinite;
        }

        @keyframes backgroundMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 50px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: boxAnimation 2s ease;
        }

        @keyframes boxAnimation {
            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 50px;
            margin-bottom: 15px;
        }

        p {
            font-size: 20px;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: white;
            color: #203a43;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
            background-color: #203a43;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome!</h1>
        <p>This is my animated website.</p>
        <button>Explore</button>
    </div>

</body>
</html>
